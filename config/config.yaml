app:
  name: Pi Face Greeter
  cooldown_seconds: 30

ui:
  fullscreen: true
  blink_interval_min: 2.0
  blink_interval_max: 6.0
  greet_cooldown_seconds: 30
  presence_frames_required: 5
  preview_width: 200
  preview_height: 150

detection:
  scale_factor: 1.05
  min_neighbors: 4
  min_face_ratio: 0.08
  use_clahe: true

diagnostics:
  debug: false                 # also enabled by env PI_FACE_GREETER_DEBUG=1
  snapshot_dir: data/debug
  snapshot_interval_seconds: 2.0

validation:
  pir_wait_seconds: 30

enrollment:
  capture_count: 5
  delay_seconds: 2
  known_faces_dir: data/known_faces

pir:
  enabled: false
  gpio_pin: 17

camera:
  enabled: true
  backend: picamera2          # picamera2 | opencv (usb only)
  capture_dir: data/captured
  width: 640
  height: 480
  warmup_frames: 2

tts:
  enabled: true
  engine: espeak
  alsa_device: null           # e.g. "plughw:1,0" — set after running: aplay -l
  voice: en
  placeholder_greeting: "Hello. Face recognition is not enabled yet."

logging:
  level: INFO
  file: data/logs/greeter.log
