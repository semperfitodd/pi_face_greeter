app:
  name: Pi Face Greeter

assistant:
  name: Freyja
  system_prompt: >
    You are {assistant_name}, a helpful executive assistant speaking out loud.
    The person with you is {person_label}. It is {time_of_day}.
    Be warm, concise, and useful. Answer in one or two short spoken sentences.
    Do not use emojis, markdown, lists, or quotation marks.
    Do not mention being an AI.

conversation:
  enabled: true
  max_turns: 20
  max_tokens: 120
  temperature: 0.7
  presence_grace_seconds: 8
  listen_chime: true

wake_word:
  enabled: true
  model: data/models/hey_freyja.onnx
  threshold: 0.5

stt:
  enabled: true
  alsa_device: null
  model: data/models/faster-whisper-tiny.en
  vad_model: data/models/silero_vad.onnx
  vad_threshold: 0.5
  compute_type: int8
  language: en
  max_record_seconds: 8
  silence_seconds: 0.8
  start_timeout_seconds: 6

ui:
  fullscreen: true
  settings_pin: null
  blink_interval_min: 2.0
  blink_interval_max: 6.0
  greet_cooldown_seconds: 30
  presence_frames_required: 5
  recognition_frames_required: 3
  preview_width: 200
  preview_height: 150

detection:
  scale_factor: 1.05
  min_neighbors: 4
  min_face_ratio: 0.08
  use_clahe: true

diagnostics:
  debug: false
  snapshot_dir: data/debug
  snapshot_interval_seconds: 2.0
  max_retained_snapshots: 50

recognition:
  tolerance: 0.6

validation:
  pir_wait_seconds: 30

enrollment:
  capture_count: 5
  delay_seconds: 2
  sample_interval_seconds: 0.4
  known_faces_dir: data/known_faces

pir:
  enabled: false
  gpio_pin: 17

camera:
  enabled: true
  backend: picamera2
  capture_dir: data/captured
  max_retained_captures: 50
  width: 640
  height: 480
  warmup_frames: 2

tts:
  enabled: true
  engine: piper
  alsa_device: null
  voice: en
  ask_how_are_you: true
  piper:
    model: data/voices/en_US-amy-medium.onnx
    length_scale: 1.0
  placeholder_greeting: "Hello. Face recognition is not enabled yet."

ollama:
  enabled: true
  base_url: http://localhost:11434
  model: llama3.2:1b
  timeout_seconds: 30
  warmup_timeout_seconds: 60
  warmup_on_startup: true
  keep_alive: 10m
  max_tokens: 60
  temperature: 0.7

logging:
  level: INFO
  file: data/logs/greeter.log
  max_bytes: 1000000
  backup_count: 3
