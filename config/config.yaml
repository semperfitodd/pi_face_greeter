app:
  name: Pi Face Greeter
  cooldown_seconds: 30

ui:
  fullscreen: true
  blink_interval_min: 2.0
  blink_interval_max: 6.0
  greet_cooldown_seconds: 30
  presence_frames_required: 5
  recognition_frames_required: 3
  preview_width: 200
  preview_height: 150

detection:
  scale_factor: 1.05
  min_neighbors: 4
  min_face_ratio: 0.08
  use_clahe: true

diagnostics:
  debug: false                 # also enabled by env PI_FACE_GREETER_DEBUG=1
  snapshot_dir: data/debug
  snapshot_interval_seconds: 2.0

recognition:
  tolerance: 0.6

validation:
  pir_wait_seconds: 30

enrollment:
  capture_count: 5
  delay_seconds: 2
  sample_interval_seconds: 0.4   # kiosk settings capture interval
  known_faces_dir: data/known_faces

pir:
  enabled: false
  gpio_pin: 17

camera:
  enabled: true
  backend: picamera2          # picamera2 | opencv (usb only)
  capture_dir: data/captured
  width: 640
  height: 480
  warmup_frames: 2

tts:
  enabled: true
  engine: piper             # piper | espeak
  alsa_device: null           # e.g. "plughw:1,0" — set after running: aplay -l
  voice: en                   # espeak fallback voice
  ask_how_are_you: true
  piper:
    model: data/voices/en_US-amy-medium.onnx
    length_scale: 1.0
  placeholder_greeting: "Hello. Face recognition is not enabled yet."

ollama:
  enabled: false
  base_url: http://localhost:11434
  model: llama3.2:1b
  timeout_seconds: 30          # cold model load on Pi can exceed 8s
  warmup_timeout_seconds: 60   # used once at app startup
  warmup_on_startup: true
  keep_alive: 10m               # keep model loaded while greeter runs
  max_tokens: 60
  temperature: 0.7

logging:
  level: INFO
  file: data/logs/greeter.log
  max_bytes: 1000000          # rotate when greeter.log exceeds this (~1 MB)
  backup_count: 3             # keep N rotated backups; total ~max_bytes * (backup_count + 1)
